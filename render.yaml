# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repository. Every push to main redeploys the site.
services:
  - type: web
    name: school33-qibray
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node ./dist/server/entry.mjs
    healthCheckPath: /uz/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      # Public address of the site (used for canonical links and sitemap.xml).
      # Change it if Render gives the service a different address, or when you add your own domain.
      - key: SITE_URL
        value: https://school33-qibray.onrender.com
      # Secrets: filled in on the Render dashboard, never stored in the repository.
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
