# Type-check and build on every push and pull request.
# Deployment itself is done by Render (see render.yaml), which redeploys on every push to main.
# The old VPS/Docker Hub pipeline is kept for reference in deploy/github-actions-vps-deploy.yml.example.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
